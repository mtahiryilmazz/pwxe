name: pwxe CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run pwxe Smoke Test Suite
        shell: powershell
        run: |
          powershell.exe -ExecutionPolicy Bypass -File .\tests\Run-Smoke.ps1
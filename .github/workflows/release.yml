name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  publish:
    name: Package and Publish pwxe
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run verification tests before publish
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-Module.ps1

      - name: Validate Release Tag Matches Manifest Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVer = '${{ github.ref_name }}' -replace '^v', ''
          $manifestVer = (Test-ModuleManifest -Path ./pwxe.psd1).Version.ToString()
          if ($tagVer -ne $manifestVer) {
            throw "Git tag version ($tagVer) does not match pwxe.psd1 manifest version ($manifestVer)!"
          }
          Write-Host "Tag version ($tagVer) matches module manifest version."

      - name: Setup NuGet CLI
        uses: nuget/setup-nuget@v2

      - name: Create NuGet Package (.nupkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          nuget pack pwxe.nuspec -OutputDirectory ./artifacts

      - name: Authenticate with NuGet (Trusted Publishing / OIDC)
        if: env.NUGET_API_KEY == ''
        id: login
        uses: NuGet/login@v1
        with:
          user: 'mtahiryilmazz'

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          LOGIN_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $apiKey = if ($env:NUGET_API_KEY) { $env:NUGET_API_KEY } elseif ($env:LOGIN_API_KEY) { $env:LOGIN_API_KEY } else { $null }
          $packages = Get-ChildItem -Path ./artifacts -Filter *.nupkg
          if (-not $packages) {
            throw "No .nupkg packages found in ./artifacts!"
          }
          foreach ($pkg in $packages) {
            Write-Host "Publishing $($pkg.FullName)..."
            if ($apiKey) {
              $env:DOTNET_NUGET_API_KEY = $apiKey
              dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key $apiKey --skip-duplicate
            } else {
              dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --skip-duplicate
            }
          }

      - name: Publish to GitHub Packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./artifacts -Filter *.nupkg
          foreach ($pkg in $packages) {
            Write-Host "Publishing $($pkg.FullName) to GitHub Packages..."
            dotnet nuget push $pkg.FullName --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          }

      - name: Publish to PowerShell Gallery
        if: env.PSGALLERY_API_KEY != ''
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Write-Host "Publishing pwxe to PowerShell Gallery..."
          ./scripts/Publish-Package.ps1 -Target PSGallery -PSGalleryApiKey $env:PSGALLERY_API_KEY -SkipValidation -SkipPack


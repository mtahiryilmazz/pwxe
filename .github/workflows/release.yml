name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Package and Publish pwxe
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup NuGet CLI
        uses: nuget/setup-nuget@v2

      - name: Create NuGet Package (.nupkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          nuget pack pwxe.nuspec -OutputDirectory ./artifacts

      - name: Authenticate with NuGet (Trusted Publishing / OIDC)
        if: env.NUGET_API_KEY == ''
        id: login
        uses: NuGet/login@v1
        with:
          user: 'mtahiryilmazz'

      - name: Publish to NuGet.org
        shell: pwsh
        run: |
          $apiKey = if ($env:NUGET_API_KEY) { $env:NUGET_API_KEY } else { '${{ steps.login.outputs.NUGET_API_KEY }}' }
          $packages = Get-ChildItem -Path ./artifacts -Filter *.nupkg
          if (-not $packages) {
            throw "No .nupkg packages found in ./artifacts!"
          }
          foreach ($pkg in $packages) {
            Write-Host "Publishing $($pkg.FullName)..."
            if ($apiKey) {
              dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key $apiKey --skip-duplicate
            } else {
              dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --skip-duplicate
            }
          }
